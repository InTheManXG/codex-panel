name: Package Windows (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-package
          cache-bin: false
      - run: npm ci
      - run: npm run app:prepare -- --target x86_64-pc-windows-msvc
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --no-sign --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -le 0) { throw "NSIS installer was not produced" }
          "Installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: codex-panel-windows-${{ github.sha }}
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
